# Validates, tests and builds Chat Handoff for ChatGPT on every push and pull request
# that touches chatgpt/.
name: ChatGPT checks

on:
  push:
    paths:
      - chatgpt/**
      - .github/workflows/chatgpt-ci.yml
  pull_request:
    paths:
      - chatgpt/**
      - .github/workflows/chatgpt-ci.yml

permissions:
  contents: read

defaults:
  run:
    working-directory: chatgpt

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_repo.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build.py
