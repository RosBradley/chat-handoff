# Publishes Chat Handoff for ChatGPT: a release tagged chatgpt-v<version> with
# chat-handoff-for-chatgpt.zip and SHA256SUMS.txt. Runs when the version in
# chatgpt/plugin.json changes on main, after validation, tests and a build, and skips a
# version that already has a release. To run it by hand: Actions tab, Release ChatGPT,
# "Run workflow".
name: Release ChatGPT

on:
  push:
    branches: [main]
    paths:
      - chatgpt/plugin.json
      - .github/workflows/release-chatgpt.yml
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: chatgpt

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_repo.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build.py

      - name: Read the version
        id: version
        run: echo "tag=chatgpt-v$(jq -r .version plugin.json)" >> "$GITHUB_OUTPUT"

      # The download links name the version, so a version bump must update them all.
      - name: Check the download links name this version
        working-directory: .
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          stale="$(grep -rnoE 'chatgpt-v[0-9]+\.[0-9]+\.[0-9]+' README.md chatgpt --include='*.md' --exclude=CHANGELOG.md | grep -v ":$TAG\$" || true)"
          [ -z "$stale" ] || { echo "::error::These links don't name $TAG:"; echo "$stale"; exit 1; }

      - name: Skip a version that's already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already released."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          version="${TAG#chatgpt-v}"
          {
            echo "**ChatGPT:** download \`chat-handoff-for-chatgpt.zip\` below and install it with Plugin Creator; see the [setup guide](https://github.com/${GITHUB_REPOSITORY}/blob/main/chatgpt/docs/setup.md). \`SHA256SUMS.txt\` verifies the ZIP."
            echo
            echo "## What's new"
            awk -v h="## $version" 'index($0, h " ") == 1 || $0 == h {f=1; next} f && /^## / {exit} f' CHANGELOG.md
          } > notes.md
          gh release create "$TAG" dist/chat-handoff-for-chatgpt.zip dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Chat Handoff for ChatGPT $version" --notes-file notes.md
