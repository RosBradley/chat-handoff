# Publishes Chat Handoff for Claude: a release tagged claude-v<version> with
# chat-handoff-for-claude.zip, the file claude.ai users upload. Runs when the version in
# claude/.claude-plugin/plugin.json changes on main, and skips a version that already
# has a release. To run it by hand: Actions tab, Release Claude, "Run workflow".
name: Release Claude

on:
  push:
    branches: [main]
    paths:
      - claude/.claude-plugin/plugin.json
      - .github/workflows/release-claude.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # claude.ai rejects an upload whose name or description breaks these rules,
      # so check them here instead of finding out after the release is out.
      - name: Check SKILL.md against claude.ai's upload rules
        run: |
          skill=claude/skills/chat-handoff/SKILL.md
          name="$(sed -n 's/^name: *//p' "$skill" | head -n 1)"
          description="$(sed -n 's/^description: *"\(.*\)"$/\1/p' "$skill" | head -n 1)"
          fail() { echo "::error file=$skill::$1"; exit 1; }
          [ -n "$description" ] || fail "No quoted description found in the frontmatter."
          case "$description" in *'<'* | *'>'*) fail "The description has < or >, which claude.ai rejects." ;; esac
          [ "${#description}" -le 1024 ] || fail "The description is ${#description} characters; claude.ai allows 1024."
          echo "$name" | grep -Eq '^[a-z0-9-]{1,64}$' || fail "The name must be 1 to 64 lowercase letters, digits or hyphens."
          case "$name" in *anthropic* | *claude*) fail "The name can't contain anthropic or claude." ;; esac
          version="$(jq -r .version claude/.claude-plugin/plugin.json)"
          grep -qx "Version: $version" "$skill" || fail "SKILL.md's Version line doesn't say $version, the version in plugin.json."
          echo "SKILL.md passes: name $name, version $version, description ${#description} characters."

      - name: Read the version
        id: version
        run: echo "tag=claude-v$(jq -r .version claude/.claude-plugin/plugin.json)" >> "$GITHUB_OUTPUT"

      # The download links name the version, so a version bump must update them all.
      - name: Check the download links name this version
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          stale="$(grep -rnoE 'claude-v[0-9]+\.[0-9]+\.[0-9]+' README.md claude --include='*.md' --exclude=CHANGELOG.md | grep -v ":$TAG\$" || true)"
          [ -z "$stale" ] || { echo "::error::These links don't name $TAG:"; echo "$stale"; exit 1; }

      - name: Skip a version that's already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already released."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # claude.ai wants the skill's folder at the top of the zip.
      - name: Build chat-handoff-for-claude.zip
        if: steps.check.outputs.skip != 'true'
        run: cd claude/skills && zip -r -X ../../chat-handoff-for-claude.zip chat-handoff

      - name: Publish the release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          version="${TAG#claude-v}"
          {
            echo "**claude.ai:** download \`chat-handoff-for-claude.zip\` below, then upload it and turn it on under **Customize > Skills**. It replaces an earlier upload, since the skill's ID is still \`chat-handoff\`."
            echo
            echo "**Claude Code:** install it as a plugin; see the [README](https://github.com/${GITHUB_REPOSITORY}/tree/main/claude#claude-code)."
            echo
            echo "## What's new"
            awk -v h="## $version" 'index($0, h " ") == 1 || $0 == h {f=1; next} f && /^## / {exit} f' claude/CHANGELOG.md
          } > notes.md
          gh release create "$TAG" chat-handoff-for-claude.zip --target "$GITHUB_SHA" --title "Chat Handoff for Claude $version" --notes-file notes.md
