# Publishes Chat Handoff for Microsoft Copilot: a release tagged microsoft-copilot-v<version>
# with chat-handoff-for-microsoft-copilot.zip, the file Copilot Cowork and Agent Builder
# users upload. Runs when the skill's SKILL.md changes on main, and skips a version that
# already has a release. To run it by hand: Actions tab, Release Microsoft Copilot,
# "Run workflow".
name: Release Microsoft Copilot

on:
  push:
    branches: [main]
    paths:
      - microsoft-copilot/skills/chat-handoff-for-microsoft-copilot/SKILL.md
      - .github/workflows/release-microsoft-copilot.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SKILL_DIR: microsoft-copilot/skills/chat-handoff-for-microsoft-copilot
    steps:
      - uses: actions/checkout@v5

      # Cowork wants a kebab-case name that matches the folder and a description of
      # at most 1,024 characters; Agent Builder caps a skill's instructions at 20,000.
      - name: Check SKILL.md against Copilot's skill rules
        id: version
        run: |
          python3 - <<'EOF'
          import os, re, sys
          folder = os.environ["SKILL_DIR"]
          path = f"{folder}/SKILL.md"
          text = open(path, encoding="utf-8").read()
          def fail(msg):
              print(f"::error file={path}::{msg}"); sys.exit(1)
          front = re.match(r"---\n(.*?)\n---\n", text, re.S) or fail("No frontmatter.")
          name = re.search(r"^name: *(.+)$", front.group(1), re.M)
          desc = re.search(r'^description: *"(.*)"$', front.group(1), re.M)
          name = name.group(1).strip() if name else fail("No name.")
          desc = desc.group(1) if desc else fail("No quoted description.")
          re.fullmatch(r"[a-z0-9]+(-[a-z0-9]+)*", name) and len(name) <= 64 or fail("The name must be kebab-case, 1 to 64 characters.")
          name == os.path.basename(folder) or fail("The name must match the folder name.")
          0 < len(desc) <= 1024 or fail(f"The description is {len(desc)} characters; Copilot allows 1024.")
          len(text) < 20000 or fail(f"SKILL.md is {len(text)} characters; Agent Builder allows under 20,000.")
          version = re.search(r"^Version: (\d+\.\d+\.\d+)$", text, re.M) or fail("No Version line.")
          print(f"SKILL.md passes: name {name}, version {version.group(1)}, description {len(desc)} characters, {len(text)} characters in all.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"tag=microsoft-copilot-v{version.group(1)}\n")
          EOF

      # The download links name the version, so a version bump must update them all.
      - name: Check the download links name this version
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          stale="$(grep -rnoE 'microsoft-copilot-v[0-9]+\.[0-9]+\.[0-9]+' README.md microsoft-copilot --include='*.md' --exclude=CHANGELOG.md | grep -v ":$TAG\$" || true)"
          [ -z "$stale" ] || { echo "::error::These links don't name $TAG:"; echo "$stale"; exit 1; }

      - name: Skip a version that's already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already released."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # Cowork and Agent Builder want SKILL.md itself at the top of the zip.
      - name: Build chat-handoff-for-microsoft-copilot.zip
        if: steps.check.outputs.skip != 'true'
        run: cd "$SKILL_DIR" && zip -r -X "$GITHUB_WORKSPACE/chat-handoff-for-microsoft-copilot.zip" .

      - name: Publish the release
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          version="${TAG#microsoft-copilot-v}"
          {
            echo "**Copilot Cowork:** download \`chat-handoff-for-microsoft-copilot.zip\` below, then in Cowork open **Customize**, **Skills**, the arrow next to **Add**, **Upload skill**. **Agent Builder:** the agent's **Configure** tab, **Skills**, **Add**. See the [README](https://github.com/${GITHUB_REPOSITORY}/tree/main/microsoft-copilot#install)."
            echo
            echo "## What's new"
            awk -v h="## $version" 'index($0, h " ") == 1 || $0 == h {f=1; next} f && /^## / {exit} f' microsoft-copilot/CHANGELOG.md
          } > notes.md
          gh release create "$TAG" chat-handoff-for-microsoft-copilot.zip --target "$GITHUB_SHA" --title "Chat Handoff for Microsoft Copilot $version" --notes-file notes.md
